name: TypeWhisper CodeQL config

paths-ignore:
  - '**/obj/**'
  - '**/bin/**'
  - '**/*.g.cs'
  - '**/*.Designer.cs'
  - '**/Generated/**'

# Suppress advisory "note"-severity catch-shape rules. The codebase uses
# `catch { }` (or `catch (ExpectedType) { }`) intentionally in two patterns:
#  - best-effort cleanup of temp files on the failure path of atomic-replace
#    writes, where the original exception must still propagate
#  - Dispose()/teardown paths, where the inner work has already logged its
#    own errors and Dispose must not throw
# Refactoring to narrower types would add noise without improving safety.
query-filters:
  - exclude:
      id: cs/catch-of-all-exceptions
  - exclude:
      id: cs/empty-catch-block
  # Compiled-C# analysis extracts source-generator output (RegexGenerator,
  # LibraryImportGenerator) under obj/. For compiled languages CodeQL analyzes
  # all built code, and the paths-ignore globs above CANNOT exclude that
  # generated code — so these low-value maintainability rules only ever fire on
  # generated files here, never on hand-written source. Real-source quality is
  # already enforced by Rider/ReSharper (jb inspectcode).
  - exclude:
      id: cs/useless-assignment-to-local
  - exclude:
      id: cs/useless-cast-to-self
  - exclude:
      id: cs/unused-label
  - exclude:
      id: cs/nested-if-statements
  - exclude:
      id: cs/complex-block
  # Every hit is a cast the compiler needs: `_ => (PluginCategory?)null` to give a
  # switch expression its natural type, `(string?)null` to pick a Moq Returns
  # overload, `(Exception?)null` to infer a tuple element as nullable (dropping it
  # is CS8619). "Useless" is wrong here in every instance.
  - exclude:
      id: cs/useless-upcast
  # Fires wherever a disposable is released in a finally block rather than by a
  # using statement. That shape is deliberate: ownership transfers to a returned
  # wrapper (ManagedFileTransaction's ArtifactLock), or a test disposes mid-body
  # to assert idempotent disposal and re-acquisition, which a using cannot express.
  - exclude:
      id: cs/missed-using-statement
  # Restructuring preferences over LINQ and conditional shape. Real-source style is
  # settled by jb inspectcode, and several of these sites already carry an explicit
  # `// ReSharper disable` with the reason the current form was chosen; re-flagging
  # them here only reopens decisions the tree has already made.
  - exclude:
      id: cs/linq/missed-where
  - exclude:
      id: cs/linq/missed-select
  - exclude:
      id: cs/missed-ternary-operator
  - exclude:
      id: cs/simplifiable-boolean-expression
  - exclude:
      id: cs/complex-condition
  # Reports "ContainsKey and indexer" when the two calls read *different* keys, as
  # in the CUDA preload assertions. There is no lookup to fold away.
  - exclude:
      id: cs/inefficient-containskey
  # P/Invoke is intrinsic to this native-interop Linux desktop app (evdev, X11,
  # PortAudio, libnotify, gsettings, …). Flagging every unmanaged call is noise.
  - exclude:
      id: cs/unmanaged-code
  - exclude:
      id: cs/call-to-unmanaged-code
