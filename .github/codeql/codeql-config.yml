name: TypeWhisper CodeQL config

paths-ignore:
  - '**/obj/**'
  - '**/bin/**'
  - '**/*.g.cs'
  - '**/*.Designer.cs'
  - '**/Generated/**'

# Suppress advisory "note"-severity catch-shape rules. The codebase uses
# `catch { }` (or `catch (ExpectedType) { }`) intentionally in two patterns:
#  - best-effort cleanup of temp files on the failure path of atomic-replace
#    writes, where the original exception must still propagate
#  - Dispose()/teardown paths, where the inner work has already logged its
#    own errors and Dispose must not throw
# Refactoring to narrower types would add noise without improving safety.
query-filters:
  - exclude:
      id: cs/catch-of-all-exceptions
  - exclude:
      id: cs/empty-catch-block
  # Compiled-C# analysis extracts source-generator output (RegexGenerator,
  # LibraryImportGenerator) under obj/. For compiled languages CodeQL analyzes
  # all built code, and the paths-ignore globs above CANNOT exclude that
  # generated code — so these low-value maintainability rules only ever fire on
  # generated files here, never on hand-written source. Real-source quality is
  # already enforced by Rider/ReSharper (jb inspectcode).
  - exclude:
      id: cs/useless-assignment-to-local
  - exclude:
      id: cs/useless-cast-to-self
  - exclude:
      id: cs/unused-label
  - exclude:
      id: cs/nested-if-statements
  # P/Invoke is intrinsic to this native-interop Linux desktop app (evdev, X11,
  # PortAudio, libnotify, gsettings, …). Flagging every unmanaged call is noise.
  - exclude:
      id: cs/unmanaged-code
  - exclude:
      id: cs/call-to-unmanaged-code
