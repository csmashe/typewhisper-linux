name: PR CI (Linux)

on:
  pull_request:
    branches:
      - linux
  push:
    branches:
      - linux
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            tests/Directory.Packages.props
            **/packages.lock.json

      - name: Create artifact directories
        run: |
          mkdir -p artifacts/logs artifacts/test-results

      - name: Restore solution
        run: dotnet restore TypeWhisper.slnx

      - name: Restore CLI
        run: dotnet restore src/TypeWhisper.Cli/TypeWhisper.Cli.csproj

      - name: Build solution
        run: dotnet build TypeWhisper.slnx -c Release --no-restore -bl:artifacts/logs/typewhisper-solution.binlog

      - name: Build CLI
        run: dotnet build src/TypeWhisper.Cli/TypeWhisper.Cli.csproj -c Release --no-restore -bl:artifacts/logs/typewhisper-cli.binlog

      - name: Verify test package lock files
        run: |
          failed=0

          # Every package-bearing test project must ship a tracked lock file, or
          # restore would be free to resolve an unreviewed dependency graph.
          for project in tests/*/*.csproj; do
            grep -q '<PackageReference' "$project" || continue
            lock="$(dirname "$project")/packages.lock.json"
            if ! git ls-files --error-unmatch -- "$lock" >/dev/null 2>&1; then
              echo "::error file=$project::Missing tracked lock file $lock. Restore the project and commit the generated lock file."
              failed=1
            fi
          done

          # --untracked-files=all also catches lock files restore generated for a
          # project whose lock file was never committed; plain `git diff` cannot.
          drift="$(git status --porcelain --untracked-files=all -- 'tests/**/packages.lock.json')"
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff -- 'tests/**/packages.lock.json'
            echo "::error::Test package lock files drifted during restore/build. Regenerate and commit the updated lock files."
            failed=1
          fi

          exit "$failed"

      - name: Test TypeWhisper.Core
        timeout-minutes: 15
        run: dotnet test tests/TypeWhisper.Core.Tests/TypeWhisper.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=TypeWhisper.Core.Tests.trx" --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini

      - name: Test plugin system
        timeout-minutes: 15
        run: dotnet test tests/TypeWhisper.PluginSystem.Tests/TypeWhisper.PluginSystem.Tests.csproj -c Release --no-build --logger "trx;LogFileName=TypeWhisper.PluginSystem.Tests.trx" --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini

      - name: Test TypeWhisper.Linux
        timeout-minutes: 15
        run: dotnet test tests/TypeWhisper.Linux.Tests/TypeWhisper.Linux.Tests.csproj -c Release --no-build --logger "trx;LogFileName=TypeWhisper.Linux.Tests.trx" --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini

      - name: Test TypeWhisper.Cli
        timeout-minutes: 15
        run: dotnet test tests/TypeWhisper.Cli.Tests/TypeWhisper.Cli.Tests.csproj -c Release --no-build --logger "trx;LogFileName=TypeWhisper.Cli.Tests.trx" --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini

      - name: Linux integration tests
        timeout-minutes: 10
        run: >
          dotnet test
          tests/TypeWhisper.Integration.Tests/TypeWhisper.Integration.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=TypeWhisper.Integration.Tests.trx"
          --results-directory artifacts/test-results
          --blame-hang
          --blame-hang-timeout 2m
          --blame-hang-dump-type mini

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-ci-linux-artifacts
          path: |
            artifacts/logs/*.binlog
            artifacts/test-results/**
          if-no-files-found: ignore
