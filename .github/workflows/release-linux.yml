name: Release (Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (defaults to the pushed tag, stripped of leading v).'
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v$VERSION"
          else
            TAG="$REF_NAME"
            if [[ "$TAG" != v* ]]; then
              echo "ERROR: workflow_dispatch without 'version' input requires a v*-prefixed tag ref. Got ref_name='$TAG'." >&2
              echo "Either trigger from a v* tag or pass the 'version' input." >&2
              exit 1
            fi
            VERSION="${TAG#v}"
          fi

          # Major.Minor.Patch with optional -prerelease and +build, per SemVer 2.0.
          # Bail out early so we don't pass garbage to `dotnet build -p:Version=...`,
          # which would either fail with a confusing message or produce an unusable package.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: derived VERSION='$VERSION' is not a valid SemVer (expected MAJOR.MINOR.PATCH[-pre][+build])." >&2
            exit 1
          fi

          TAG_REF="refs/tags/$TAG"
          REMOTE_TAG_REFS=$(git ls-remote origin "$TAG_REF" "${TAG_REF}^{}")
          if [ -n "$REMOTE_TAG_REFS" ]; then
            TAG_COMMIT=$(printf '%s\n' "$REMOTE_TAG_REFS" \
              | awk -v ref="${TAG_REF}^{}" '$2 == ref { print $1; exit }')
            if [ -z "$TAG_COMMIT" ]; then
              TAG_COMMIT=$(printf '%s\n' "$REMOTE_TAG_REFS" \
                | awk -v ref="$TAG_REF" '$2 == ref { print $1; exit }')
            fi

            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "ERROR: remote tag '$TAG' points at $TAG_COMMIT, but this workflow is building $GITHUB_SHA." >&2
              echo "Refusing to publish artifacts built from different source code." >&2
              exit 1
            fi

            echo "Verified remote tag $TAG points at workflow commit $GITHUB_SHA."
          else
            echo "Remote tag $TAG does not exist; release creation will pin it to workflow commit $GITHUB_SHA."
          fi

          IS_PRERELEASE="false"
          case "$VERSION" in
            *-*) IS_PRERELEASE="true" ;;
          esac

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "Release tag: $TAG"
          echo "Package version: $VERSION"
          echo "Prerelease: $IS_PRERELEASE"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Install packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev rpm wget desktop-file-utils

      - name: Run unit tests
        run: |
          dotnet restore TypeWhisper.slnx
          dotnet build TypeWhisper.slnx -c Release --no-restore -p:Version=${VERSION}
          dotnet test tests/TypeWhisper.Core.Tests/TypeWhisper.Core.Tests.csproj -c Release --no-build
          dotnet test tests/TypeWhisper.PluginSystem.Tests/TypeWhisper.PluginSystem.Tests.csproj -c Release --no-build
          dotnet test tests/TypeWhisper.Linux.Tests/TypeWhisper.Linux.Tests.csproj -c Release --no-build
          dotnet test tests/TypeWhisper.Cli.Tests/TypeWhisper.Cli.Tests.csproj -c Release --no-build

      - name: Build all Linux packages
        run: bash scripts/build-linux-packages.sh "$VERSION" dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    # Serialize same-tag runs so an overlapping re-push / dispatch can't race through
    # verification and release creation; different tags still proceed independently.
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail

          NOTES_FILE="docs/releases/${TAG}.md"

          EXISTING_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "")

          # Re-checks the remote tag right before touching the release, closing the race with
          # prepare's provenance gate. Mismatch -> exit (the only defence on create: gh silently
          # ignores --target once the tag exists). Absent -> return 1: create paths pin the tag
          # via --target, upload paths refuse. Also what makes --clobber safe below.
          verify_remote_tag_matches_build() {
            local tag_ref remote_tag_refs ls_remote_status tag_commit
            tag_ref="refs/tags/$TAG"
            remote_tag_refs=$(git ls-remote origin "$tag_ref" "${tag_ref}^{}")
            ls_remote_status=$?
            if [ "$ls_remote_status" -ne 0 ]; then
              echo "ERROR: could not query remote tag '$TAG' (git ls-remote exited $ls_remote_status)." >&2
              echo "Refusing to proceed unverified: a network/auth failure must not be read as an absent tag." >&2
              exit 1
            fi

            if [ -z "$remote_tag_refs" ]; then
              return 1
            fi

            tag_commit=$(printf '%s\n' "$remote_tag_refs" \
              | awk -v ref="${tag_ref}^{}" '$2 == ref { print $1; exit }')
            if [ -z "$tag_commit" ]; then
              tag_commit=$(printf '%s\n' "$remote_tag_refs" \
                | awk -v ref="$tag_ref" '$2 == ref { print $1; exit }')
            fi

            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "ERROR: remote tag '$TAG' points at $tag_commit, but this workflow built $GITHUB_SHA." >&2
              echo "Refusing to publish or replace release assets built from different source code." >&2
              exit 1
            fi

            return 0
          }

          # A mismatch exits inside the function; the else branch only means the tag is absent.
          if verify_remote_tag_matches_build; then
            TAG_PRESENT="true"
          else
            TAG_PRESENT="false"
          fi

          EDIT_ARGS=(--draft=false)
          CREATE_FLAGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EDIT_ARGS+=(--prerelease)
            CREATE_FLAGS+=(--prerelease)
          fi

          if { [ "$EXISTING_DRAFT" = "true" ] || [ "$EXISTING_DRAFT" = "false" ]; } && [ "$TAG_PRESENT" != "true" ]; then
            echo "ERROR: release '$TAG' exists, but its remote tag does not." >&2
            echo "Refusing to replace release assets without a tag pinned to $GITHUB_SHA." >&2
            exit 1
          fi

          if [ "$EXISTING_DRAFT" = "true" ]; then
            echo "Draft release found for $TAG. Uploading assets and publishing..."
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" "${EDIT_ARGS[@]}"
          elif [ "$EXISTING_DRAFT" = "false" ]; then
            echo "Published release found for $TAG. Uploading assets..."
            gh release upload "$TAG" release-assets/* --clobber
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --prerelease
            fi
          elif [ -f "$NOTES_FILE" ]; then
            echo "Using curated release notes from $NOTES_FILE"
            CREATE_ARGS=("$TAG" release-assets/* --title "$TAG" --notes-file "$NOTES_FILE" --target "$GITHUB_SHA")
            CREATE_ARGS+=("${CREATE_FLAGS[@]}")
            gh release create "${CREATE_ARGS[@]}"
          else
            echo "No existing release. Generating notes from commits..."

            if [ "$IS_PRERELEASE" = "true" ]; then
              PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname \
                | grep -F -x -v "${TAG}" \
                | head -1 || true)
            else
              PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | grep -F -x -v "${TAG}" \
                | head -1 || true)
            fi

            RANGE_END="$TAG"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              RANGE_END="$(git rev-parse HEAD)"
            fi

            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..${RANGE_END}"
            else
              RANGE="$RANGE_END"
            fi

            FEATURES=""
            FIXES=""
            OTHER=""

            while IFS= read -r line; do
              [ -z "$line" ] && continue

              MSG=$(echo "$line" | sed 's/^[a-f0-9]* //')

              echo "$MSG" | grep -qiE '^(Merge |chore: bump|chore\(release\)|docs: update README)' && continue

              if echo "$MSG" | grep -qE '^feat(\(.*\))?:'; then
                ENTRY=$(echo "$MSG" | sed 's/^feat\(([^)]*)\)\{0,1\}: //')
                FEATURES="${FEATURES}- ${ENTRY}\n"
              elif echo "$MSG" | grep -qE '^fix(\(.*\))?:'; then
                ENTRY=$(echo "$MSG" | sed 's/^fix\(([^)]*)\)\{0,1\}: //')
                FIXES="${FIXES}- ${ENTRY}\n"
              else
                ENTRY=$(echo "$MSG" | sed 's/^[a-z]*\(([^)]*)\)\{0,1\}: //')
                OTHER="${OTHER}- ${ENTRY}\n"
              fi
            done <<< "$(git log --oneline --no-merges "$RANGE")"

            NOTES=""
            if [ -n "$FEATURES" ]; then
              NOTES="${NOTES}## New Features\n${FEATURES}\n"
            fi
            if [ -n "$FIXES" ]; then
              NOTES="${NOTES}## Bug Fixes\n${FIXES}\n"
            fi
            if [ -n "$OTHER" ]; then
              NOTES="${NOTES}## Other Changes\n${OTHER}\n"
            fi

            if [ -z "$NOTES" ]; then
              NOTES="Maintenance release ${TAG}"
            fi

            CREATE_ARGS=("$TAG" release-assets/* --title "$TAG" --notes "$(printf '%b' "$NOTES")" --target "$GITHUB_SHA")
            CREATE_ARGS+=("${CREATE_FLAGS[@]}")
            gh release create "${CREATE_ARGS[@]}"
          fi
